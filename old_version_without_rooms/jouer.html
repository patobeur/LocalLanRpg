<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Top‑Down LAN (2 joueurs)</title>
	<link rel="stylesheet" href="jouer.css" />
</head>

<body>
	<div id="hud"></div>
	<div id="ui">
		<div id="card">
			<h2>Créer/charger un profil</h2>
			<label>Pseudo</label>
			<input id="name" type="text" maxlength="16" placeholder="Ex: Pixelou" />
			<label>Couleur du joueur</label>
			<input id="color" type="color" value="#4caf50" />
			<button id="save">Continuer</button>
			<div id="hint">Touches : ZQSD / WASD pour bouger.<br />Ouvre cet onglet sur un
				autre PC et passe l'IP du serveur :
				<code>?server=http://192.168.x.x:8080</code>
			</div>
		</div>
	</div>
	<canvas id="c"></canvas>
	<script type="module" src="js/main.js?v=2"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<title>Vue des Modèles 3D</title>
		<style>
			body {
				margin: 0;
			}
			canvas {
				display: block;
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"three": "/node_modules/three/build/three.module.js",
					"three/examples/jsm/loaders/FBXLoader.js": "/node_modules/three/examples/jsm/loaders/FBXLoader.js",
					"three/examples/jsm/controls/OrbitControls.js": "/node_modules/three/examples/jsm/controls/OrbitControls.js"
				}
			}
		</script>
	</head>
	<body>
		<script type="module">
			import * as THREE from "three";
			import { FBXLoader } from "three/examples/jsm/loaders/FBXLoader.js";
			import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

			let scene, camera, renderer, controls;
			const models = [];

			const files = {
				minion_mage_blue: {
					path: "/media/minions/glb/minion_mage_blue.fbx",
				},
				minion_mage_red: { path: "/media/minions/glb/minion_mage_red.fbx" },
				minion_tank_blue: {
					path: "/media/minions/glb/minion_tank_blue.fbx",
				},
				minion_tank_red: { path: "/media/minions/glb/minion_tank_red.fbx" },
				X_Bot: { path: "/media/characters/glb/X_Bot.fbx" },
				Y_Bot: { path: "/media/characters/glb/Y_Bot.fbx" },
				Y_Bot: { path: "/media/structures/glb/baseTeamB.glb" },
			};

			function init() {
				scene = new THREE.Scene();
				scene.background = new THREE.Color(0xdddddd);

				camera = new THREE.PerspectiveCamera(
					75,
					window.innerWidth / window.innerHeight,
					0.1,
					1000
				);
				camera.position.set(0, 1.5, 5);

				renderer = new THREE.WebGLRenderer({ antialias: true });
				renderer.setSize(window.innerWidth, window.innerHeight);
				document.body.appendChild(renderer.domElement);

				controls = new OrbitControls(camera, renderer.domElement);

				const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
				scene.add(ambientLight);

				const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
				directionalLight.position.set(5, 10, 7.5);
				scene.add(directionalLight);

				loadModels();

				animate();
			}

			function loadModels() {
				const loader = new FBXLoader();
				const modelPaths = Object.values(files).map((file) => file.path);
				const numModels = modelPaths.length;
				const modelsPerRow = 3;
				const spacing = 2;

				modelPaths.forEach((path, index) => {
					loader.load(
						path,
						(fbx) => {
							const model = fbx;
							const row = Math.floor(index / modelsPerRow);
							const col = index % modelsPerRow;

							model.position.set(
								(col - (modelsPerRow - 1) / 2) * spacing,
								-row * spacing,
								0
							);

							model.scale.set(0.01, 0.01, 0.01);

							scene.add(model);
							models.push(model);
						},
						undefined,
						(error) => {
							console.error(
								"An error happened while loading the model:",
								error
							);
						}
					);
				});
			}

			function animate() {
				requestAnimationFrame(animate);

				models.forEach((model) => {
					model.rotation.y += 0.005;
				});

				controls.update();
				renderer.render(scene, camera);
			}

			window.addEventListener("resize", () => {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
			});

			init();
		</script>
	</body>
</html>
